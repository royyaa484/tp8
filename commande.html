<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body> 
<h1>Formulaire de Commande</h1>
<form id="formCommande" onsubmit="return VerifierCommande()">
<label for="adresse">Adresse de livraison :</label>
<input type="text" id="adresse" name="adresse"><br><br>
<label for="entree">Choisissez une entrée :</label><br>
<select id="entree" onchange="gererSelection('entree', 'nbEntree');mettreAJourPanierGlobal()">
<option value="0">Aucun</option>
<option value="8.5">Salade César (8.5 DT)</option>
<option value="4.0"> Brik à l'œuf (4.0 DT)</option>
</select> <br> 
<label for="nbEntree">Nombre de personnes :</label>
<input type="number" id="nbEntree" value="0" min="0" oninput="calculerPrix()"><br><br>

<label for="plat">Choisissez un plat :</label><br>
<select id="plat" onchange="gererSelection('plat', 'nbPlat');mettreAJourPanierGlobal()">
<option value="0">Aucun</option>
<option value="18.0">Couscous Aagneau (18.0DT)</option>
<option value="14.5"> Excalope Grillé (14.5 DT)</option>
</select><br>
<label for="nbEntree">Nombre de personnes :</label>
<input type="number" id="nbPlat" value="0" min="0" oninput="calculerPrix()"><br><br>

<label for="dessert">Choisissez un dessert :</label><br>
<select id="dessert" onchange="gererSelection('dessert', 'nbDessert');mettreAJourPanierGlobal()">
<option value="0">Aucun</option>
<option value="6.5">Tiramisu (6.5 DT)</option>
<option value="5.0"> Salade de fruits (5.0 DT)</option>
</select><br>
<label for="nbEntree">Nombre de personnes :</label>
<input type="number" id="nbDessert" value="0" min="0" oninput="calculerPrix()"><br><br>

<label for="total">Tarif total :</label>
<input type="text" id="total" value="0.00" disabled><br>
<button type="submit">Envoyer</button>
<!-- Section Panier Dynamique (Droite) -->
<div class="cart-section">
<h3>Mon Panier</h3>
<ul id="liste-panier">
<!-- Les articles ajoutés dynamiquement apparaîtront ici -->
</ul>
<div class="cart-totals">
<p>Frais de livraison : <span id="affichage-livraison">0.00 DT</span></p>
</div>
</div>
</div>
</form>

</body>
</html>
